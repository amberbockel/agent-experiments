<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product Launch Checklist</title>
  <link rel="stylesheet" href="../../brand/amberbockel.css">
  <script>
    // Set theme before paint to avoid flash of the wrong theme.
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem('ab-theme') || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <style>
    /* ---------- APP LAYER (brand tokens only) ---------- */
    body {
      min-height: 100dvh;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        calc(var(--ab-8) + 20px + env(safe-area-inset-bottom))
        env(safe-area-inset-left);
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: var(--ab-6) max(var(--ab-4), env(safe-area-inset-left)) var(--ab-6)
               max(var(--ab-4), env(safe-area-inset-right));
    }

    /* ---------- HEADER ---------- */
    header {
      text-align: center;
      margin-bottom: var(--ab-6);
    }

    .eyebrow {
      display: inline-block;
      font-size: var(--ab-text-xs);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ab-accent);
      font-weight: 600;
      margin-bottom: var(--ab-3);
    }

    h1 {
      font-size: var(--ab-display-sm);
      margin-bottom: var(--ab-2);
    }

    .subtitle {
      font-size: var(--ab-text-base);
      color: var(--ab-muted);
      margin: 0;
    }

    /* ---------- PROGRESS RING ---------- */
    .progress-ring {
      position: relative;
      width: 148px;
      height: 148px;
      margin: 0 auto var(--ab-6);
    }

    .progress-ring svg {
      transform: rotate(-90deg);
      width: 148px;
      height: 148px;
      display: block;
    }

    .progress-ring circle {
      fill: none;
      stroke-width: 8;
      /* r=54 at scale ~1.233 to fill 148px viewport frame via transform */
    }

    .progress-ring .background {
      stroke: var(--ab-line);
    }

    .progress-ring .progress {
      stroke: var(--ab-accent);
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px var(--ab-accent-soft));
      transition: stroke-dashoffset .6s var(--ab-ease);
    }

    .progress-text {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--ab-font-display);
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ab-text);
    }

    .progress-label {
      position: absolute;
      top: 64%;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: var(--ab-text-xs);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ab-faint);
    }

    /* ---------- PHASES (glass cards) ---------- */
    .phase {
      background: var(--ab-glass-bg);
      border: 1px solid var(--ab-glass-border);
      border-radius: var(--ab-r-lg);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      padding: var(--ab-5);
      margin-bottom: var(--ab-4);
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ab-3);
      margin-bottom: var(--ab-3);
    }

    .phase-title {
      font-family: var(--ab-font-display);
      font-size: var(--ab-text-xl);
      font-weight: 400;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: var(--ab-2);
    }

    .phase-title span:first-child {
      font-size: 1.15rem;
      line-height: 1;
    }

    .phase-count {
      flex-shrink: 0;
      font-size: var(--ab-text-xs);
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--ab-accent);
      background: var(--ab-accent-soft);
      padding: 5px 11px;
      border-radius: var(--ab-r-pill);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- TASK ROWS ---------- */
    .task {
      display: flex;
      align-items: flex-start;
      gap: var(--ab-3);
      min-height: 44px;
      padding: var(--ab-2) var(--ab-2);
      margin: 2px calc(var(--ab-2) * -1);
      border-radius: var(--ab-r-sm);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color var(--ab-dur) var(--ab-ease);
    }

    .task:hover {
      background: var(--ab-glass-hover);
    }

    .task:active {
      transform: scale(.99);
    }

    .task input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 24px;
      height: 24px;
      margin-top: 8px;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid var(--ab-glass-highlight);
      border-radius: 7px;
      background: var(--ab-glass-bg);
      transition: background-color var(--ab-dur) var(--ab-ease),
                  border-color var(--ab-dur) var(--ab-ease),
                  transform var(--ab-dur) var(--ab-ease);
    }

    .task input[type="checkbox"]:hover {
      border-color: var(--ab-accent);
    }

    .task input[type="checkbox"]:checked {
      background: var(--ab-accent);
      border-color: var(--ab-accent);
    }

    .task input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .task input[type="checkbox"]:active {
      transform: scale(.9);
    }

    .task label {
      cursor: pointer;
      font-size: var(--ab-text-base);
      line-height: 1.5;
      padding-top: 6px;
      flex: 1;
      color: var(--ab-text);
      transition: color var(--ab-dur) var(--ab-ease);
    }

    .task.done label {
      color: var(--ab-faint);
      text-decoration: line-through;
    }

    /* ---------- FIXED ACTION BAR ---------- */
    .actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      gap: var(--ab-3);
      padding: var(--ab-3) max(var(--ab-4), env(safe-area-inset-left));
      padding-bottom: calc(var(--ab-3) + env(safe-area-inset-bottom));
      background: var(--ab-glass-bg);
      border-top: 1px solid var(--ab-glass-border);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
    }

    .actions .ab-btn {
      flex: 1;
      max-width: 640px;
    }

    .actions > .ab-btn:first-child { margin-left: auto; }
    .actions > .ab-btn:last-child { margin-right: auto; }

    /* ---------- CELEBRATION ---------- */
    .celebration {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--ab-5);
      background: rgba(0, 0, 0, .66);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .celebration.show {
      display: flex;
      animation: ab-fade-in var(--ab-dur) var(--ab-ease);
    }

    .celebration-content {
      position: relative;
      max-width: 400px;
      width: 100%;
      text-align: center;
      padding: var(--ab-7) var(--ab-6);
      background: var(--ab-surface);
      border: 1px solid var(--ab-glass-border);
      border-radius: var(--ab-r-lg);
      box-shadow: 0 24px 80px rgba(224, 26, 138, .18);
      overflow: hidden;
    }

    .celebration-content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px 220px at 50% -10%, var(--ab-accent-soft), transparent 70%);
      pointer-events: none;
    }

    .celebration.show .celebration-content {
      animation: ab-pop-in 420ms var(--ab-ease) both;
    }

    .celebration-emoji {
      position: relative;
      font-size: 64px;
      line-height: 1;
      margin-bottom: var(--ab-4);
    }

    .celebration.show .celebration-emoji {
      animation: ab-pop-emoji 600ms var(--ab-ease) both;
    }

    .celebration-title {
      position: relative;
      font-family: var(--ab-font-display);
      font-weight: 400;
      font-size: var(--ab-display-sm);
      letter-spacing: -.01em;
      margin-bottom: var(--ab-3);
      color: var(--ab-text);
    }

    .celebration-text {
      position: relative;
      font-size: var(--ab-text-base);
      color: var(--ab-muted);
      margin-bottom: var(--ab-6);
    }

    .celebration .ab-btn { position: relative; }

    @keyframes ab-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes ab-pop-in {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes ab-pop-emoji {
      0%   { transform: scale(0) rotate(-20deg); }
      60%  { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* ---------- THEME TOGGLE ---------- */
    .ab-theme-toggle {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 60;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: var(--ab-r-pill);
      font-size: 18px;
      line-height: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .celebration.show,
      .celebration.show .celebration-content,
      .celebration.show .celebration-emoji { animation: none !important; }
    }
  </style>
</head>
<body>
  <button class="ab-btn ab-btn--glass ab-theme-toggle" id="theme-toggle"
          type="button" aria-label="Toggle light or dark theme" title="Toggle theme">◐</button>

  <div class="container">
    <header>
      <span class="eyebrow">Agent Experiments</span>
      <h1>Product Launch</h1>
      <p class="subtitle">Ship your next creative product</p>
    </header>

    <div class="progress-ring">
      <svg width="148" height="148" viewBox="0 0 120 120">
        <circle class="background" cx="60" cy="60" r="54"></circle>
        <circle class="progress" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="339.292"></circle>
      </svg>
      <div class="progress-text">0%</div>
      <div class="progress-label">complete</div>
    </div>

    <div id="checklist"></div>
  </div>

  <div class="actions">
    <button class="ab-btn ab-btn--glass" id="reset">Reset</button>
    <button class="ab-btn ab-btn--primary" id="export">Export</button>
  </div>

  <div class="celebration" id="celebration">
    <div class="celebration-content">
      <div class="celebration-emoji">🎉</div>
      <div class="celebration-title">Ready to Ship!</div>
      <div class="celebration-text">You've completed every task. Time to launch your product to the world.</div>
      <button class="ab-btn ab-btn--primary ab-btn--lg ab-btn--block" id="celebrate-close">Let's Go</button>
    </div>
  </div>

  <script>
    const phases = [
      {
        title: "Create",
        emoji: "✨",
        tasks: [
          "Create final product (art, design, prototype)",
          "Take high-quality product photos",
          "Edit and optimize images for web",
          "Write compelling product description",
          "Set pricing (cost + margin + positioning)"
        ]
      },
      {
        title: "List",
        emoji: "🏪",
        tasks: [
          "Upload product to Etsy/Shopify/platform",
          "Add product title and tags (SEO)",
          "Set inventory quantity and variants",
          "Configure shipping options and rates",
          "Preview listing on mobile and desktop"
        ]
      },
      {
        title: "Market",
        emoji: "📣",
        tasks: [
          "Create Instagram carousel or Reel",
          "Write social media captions",
          "Post to Instagram, Facebook, TikTok",
          "Share in relevant Facebook/Discord groups",
          "Email your mailing list (if applicable)",
          "Post in Substack (if relevant)"
        ]
      },
      {
        title: "Launch",
        emoji: "🚀",
        tasks: [
          "Set product live and visible",
          "Pin product to top of shop",
          "Monitor first orders and reviews",
          "Respond to questions quickly",
          "Celebrate your launch! 🎉"
        ]
      }
    ];

    let state = loadState();

    function loadState() {
      const saved = localStorage.getItem('product-launch-state');
      if (saved) {
        return JSON.parse(saved);
      }
      // Initialize all tasks as unchecked
      const initial = {};
      phases.forEach((phase, pi) => {
        phase.tasks.forEach((task, ti) => {
          initial[`${pi}-${ti}`] = false;
        });
      });
      return initial;
    }

    function saveState() {
      localStorage.setItem('product-launch-state', JSON.stringify(state));
    }

    function render() {
      const checklist = document.getElementById('checklist');
      checklist.innerHTML = '';

      phases.forEach((phase, phaseIndex) => {
        const phaseEl = document.createElement('div');
        phaseEl.className = 'phase';

        const doneCount = phase.tasks.filter((_, taskIndex) =>
          state[`${phaseIndex}-${taskIndex}`]
        ).length;

        phaseEl.innerHTML = `
          <div class="phase-header">
            <div class="phase-title">
              <span>${phase.emoji}</span>
              <span>${phase.title}</span>
            </div>
            <div class="phase-count">${doneCount}/${phase.tasks.length}</div>
          </div>
        `;

        phase.tasks.forEach((task, taskIndex) => {
          const taskId = `${phaseIndex}-${taskIndex}`;
          const checked = state[taskId];

          const taskEl = document.createElement('div');
          taskEl.className = `task ${checked ? 'done' : ''}`;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.id = taskId;
          checkbox.checked = checked;
          checkbox.addEventListener('change', () => toggleTask(taskId));

          const label = document.createElement('label');
          label.htmlFor = taskId;
          label.textContent = task;

          taskEl.appendChild(checkbox);
          taskEl.appendChild(label);
          phaseEl.appendChild(taskEl);
        });

        checklist.appendChild(phaseEl);
      });

      updateProgress();
    }

    function toggleTask(taskId) {
      state[taskId] = !state[taskId];
      saveState();
      render();
      checkCompletion();
    }

    function updateProgress() {
      const total = Object.keys(state).length;
      const done = Object.values(state).filter(Boolean).length;
      const percent = Math.round((done / total) * 100);

      const circle = document.querySelector('.progress-ring .progress');
      const circumference = 339.292;
      const offset = circumference - (done / total) * circumference;
      circle.style.strokeDashoffset = offset;

      document.querySelector('.progress-text').textContent = `${percent}%`;
    }

    function checkCompletion() {
      const allDone = Object.values(state).every(Boolean);
      if (allDone) {
        document.getElementById('celebration').classList.add('show');
      }
    }

    function reset() {
      if (confirm('Reset checklist and start a new product launch?')) {
        Object.keys(state).forEach(key => state[key] = false);
        saveState();
        render();
      }
    }

    function exportChecklist() {
      const total = Object.keys(state).length;
      const done = Object.values(state).filter(Boolean).length;
      let text = `Product Launch Checklist (${done}/${total} complete)\n\n`;

      phases.forEach((phase, pi) => {
        text += `${phase.emoji} ${phase.title}\n`;
        phase.tasks.forEach((task, ti) => {
          const checked = state[`${pi}-${ti}`];
          text += `${checked ? '✅' : '⬜'} ${task}\n`;
        });
        text += '\n';
      });

      // Copy to clipboard
      navigator.clipboard.writeText(text).then(() => {
        alert('Checklist copied to clipboard!');
      }).catch(() => {
        // Fallback: show in alert
        alert(text);
      });
    }

    document.getElementById('reset').addEventListener('click', reset);
    document.getElementById('export').addEventListener('click', exportChecklist);
    document.getElementById('celebrate-close').addEventListener('click', () => {
      document.getElementById('celebration').classList.remove('show');
    });

    // Initial render
    render();

    // Check if already complete on load
    if (Object.values(state).every(Boolean)) {
      setTimeout(() => {
        document.getElementById('celebration').classList.add('show');
      }, 500);
    }
  </script>

  <script>
    // Brand light/dark theme toggle (persists per viewer).
    (function () {
      const KEY = 'ab-theme';
      const root = document.documentElement;
      try { root.dataset.theme = localStorage.getItem(KEY) || 'dark'; } catch (e) { root.dataset.theme = 'dark'; }
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.addEventListener('click', () => {
          root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
          try { localStorage.setItem(KEY, root.dataset.theme); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
