<title>Deep End 02</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Study 02: the paper moves to the music. Hinged cutouts, built backdrops, torn cuts on the beat. */
  :root {
    --ink: #f3ede2;
    --ink-dim: rgba(243, 237, 226, 0.55);

    background: var(--room); color: var(--ink); font-family: var(--mono); overflow: hidden;

    padding-left: max(16px, env(safe-area-inset-left, 0px));

  #veil { position: fixed; inset: 0; pointer-events: none;

  .hud { position: fixed; z-index: 3; pointer-events: none; font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
    color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #brand { top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); }
  #depth { top: calc(18px + env(safe-area-inset-top, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); }
  #tempo { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); text-align: right; }
  #tempo b { font-weight: 400; color: var(--ink); }
  #caption { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: 40%;
    font-size: 14px; color: var(--ink); opacity: 0; transform: translateY(4px); transition: opacity 0.35s ease, transform 0.35s ease;
    text-transform: none; letter-spacing: 0.02em; }
  #caption.on { opacity: 1; transform: none; }
  #whisper { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 13px; font-style: italic;
    color: var(--ink-dim); opacity: 0; transition: opacity 1.2s ease; text-transform: none; }
  #whisper.on { opacity: 1; }
  #drop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(11,10,12,0.72); font-size: 14px;
    letter-spacing: 0.2em; text-transform: lowercase; color: var(--ink); pointer-events: none; }
  #drop.on { display: grid; }

  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; background: var(--room); transition: opacity 1.4s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .card { max-width: 36ch; padding: 24px; display: grid; gap: 22px; justify-items: center; }
  #intro h1 { font-weight: 400; font-size: 15px; letter-spacing: 0.34em; text-transform: lowercase; margin: 0; color: var(--ink); text-wrap: balance; }
  #intro p { margin: 0; font-size: 13px; line-height: 1.75; color: var(--ink-dim); text-wrap: balance; }
  #enter { font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: lowercase; color: var(--ink); background: transparent;
    border: 1px solid rgba(243,237,226,0.35); border-radius: 999px; padding: 12px 26px; cursor: pointer; transition: border-color 0.3s, background 0.3s; }
  #enter:hover, #enter:focus-visible { border-color: var(--ink); background: rgba(243,237,226,0.06); outline: none; }
  #again { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.12em; min-height: 1em; }
  @media (prefers-reduced-motion: reduce) { #intro { transition: none; } }
</style>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---------- memory ----------

// [name, x, y, z, height, rot deg, caption, rig]
const LAYOUT = [

const BACKDROPS = [
  // [name, y center, height, z, repeatX]
  ['bg-sky',   -3.0, 16.5, -7.0, 1],

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 12);
scene.add(camera);
const light = new THREE.Vector3(1.5, 1.0, 2.0), lightTarget = light.clone();
const uPulse = { value: 0 }, uStep = { value: 0 };

// ---------- shaders ----------
const vert = /* glsl */`varying vec2 vUv; varying vec3 vW;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const pieceFrag = /* glsl */`
  uniform sampler2D map; uniform vec3 uLight; uniform float uAmbient; uniform vec3 uTint; uniform float uOpacity; uniform float uPulse;
  varying vec2 vUv; varying vec3 vW;
  void main(){
    vec4 t = texture2D(map, vUv); if (t.a < 0.02) discard;
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(11.0, 0.0, d) * (1.0 + 0.35 * uPulse);
    vec3 c = t.rgb * (uAmbient + 0.6 * spot) * uTint;
    c *= mix(vec3(1.0), vec3(1.07, 1.0, 0.93), spot);
    gl_FragColor = vec4(c, t.a * uOpacity);
  }`;
const backFrag = /* glsl */`
  uniform sampler2D map; uniform vec3 uLight; uniform float uPulse; uniform vec2 uRepeat; uniform float uTop; uniform float uBottom; uniform float uStep;
  varying vec2 vUv; varying vec3 vW;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  void main(){
    vec3 t = texture2D(map, vUv * uRepeat).rgb;
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(16.0, 0.0, d) * (1.0 + 0.25 * uPulse);
    vec3 c = t * (0.42 + 0.5 * spot);
    c = mix(c, vec3(dot(c, vec3(0.3, 0.59, 0.11))), 0.25);   // a little drained, so the paper in front stays the color
    float g = hash(floor(vW.xy * 60.0) + uStep) - 0.5; c += g * 0.045;
    float fade = smoothstep(uTop, uTop - 2.5, vW.y) * smoothstep(uBottom, uBottom + 2.5, vW.y);
    gl_FragColor = vec4(c, fade);
  }`;
const waterFrag = /* glsl */`
  uniform float uStep; uniform vec3 uLight; varying vec3 vW; varying vec2 vUv;
  void main(){
    float t = uStep / 12.0; vec2 p = vW.xy * 0.9;
    float c1 = sin(p.x * 1.7 + t * 0.8) + sin(p.y * 1.3 - t * 0.6);
    float c2 = sin((p.x + p.y) * 1.1 + t * 0.5) + sin((p.x - p.y) * 0.9 - t * 0.7);
    float caustic = pow(max(0.0, 0.5 + 0.25 * (c1 + c2)), 3.0);
    float edge = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
    float spot = smoothstep(12.0, 0.0, distance(vW.xy, uLight.xy));
    vec3 col = mix(vec3(0.12, 0.38, 0.55), vec3(0.55, 0.85, 0.95), caustic * (0.4 + 0.6 * spot));
    gl_FragColor = vec4(col, edge * (0.16 + 0.12 * caustic));
  }`;
const tearFrag = /* glsl */`
  uniform float uProg; uniform float uSeed; uniform float uDir; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
  void main(){
    vec2 uv = vUv; if (uDir > 0.5) uv.x = 1.0 - uv.x;
    float n = noise(uv * vec2(3.0, 9.0) + uSeed * 17.0) * 0.6 + noise(uv * vec2(12.0, 30.0) + uSeed * 31.0) * 0.4;
    float torn = uv.x * 0.72 + n * 0.28;
    float a = 1.0 - smoothstep(uProg - 0.015, uProg + 0.015, torn);
    float edge = smoothstep(uProg - 0.06, uProg - 0.015, torn);
    vec3 paper = vec3(0.98, 0.965, 0.93);
    vec3 fibre = mix(paper, vec3(0.78, 0.72, 0.64), edge * 0.8);
    float grain = (hash(floor(vUv * 500.0)) - 0.5) * 0.05;
    gl_FragColor = vec4(fibre + grain, a);
  }`;

// ---------- backdrops, lattice, water ----------
const loader = new THREE.TextureLoader();
const loadTex = url => new Promise((res, rej) => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, rej));
const zoneAt = y => ({ yard: THREE.MathUtils.smoothstep(y, -17, -11), dark: 1 - THREE.MathUtils.smoothstep(y, -32, -25) });
function tintFor(y) {
  const { yard, dark } = zoneAt(y);
  const t = new THREE.Color(0.82, 0.9, 0.98).lerp(new THREE.Color(1.0, 0.97, 0.92), yard).lerp(new THREE.Color(0.94, 0.86, 0.84), dark);
  return { t, ambient: 0.5 + 0.2 * yard - 0.05 * dark };
}
async function addBackdrops(manifest) {
  for (const [name, yc, h, z, rep] of BACKDROPS) {
    const m = manifest[name]; if (!m) continue;
    const tex = await loadTex(`assets/${name}.jpg`); tex.wrapS = THREE.MirroredRepeatWrapping;
    const w = h * (m.w / m.h) * rep;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(w, 28), h), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: vert, fragmentShader: backFrag,
      uniforms: { map: { value: tex }, uLight: { value: light }, uPulse, uStep, uRepeat: { value: new THREE.Vector2(Math.max(w, 28) / (h * m.w / m.h), 1) }, uTop: { value: yc + h / 2 }, uBottom: { value: yc - h / 2 } } }));
    mesh.position.set(0, yc, z); mesh.renderOrder = -2; scene.add(mesh);
  }

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshBasicMaterial({ color: 0x14100f }));
  wall.position.set(0, -20, -7.5); wall.renderOrder = -3; scene.add(wall);
}
function latticeTexture() {
  const s = 1024, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
  g.save(); g.translate(s / 2, s / 2); g.rotate(Math.PI / 4); const pitch = 190, w = 54;
  for (let i = -8; i <= 8; i++) { const grd = g.createLinearGradient(i * pitch - w / 2, 0, i * pitch + w / 2, 0); grd.addColorStop(0, '#d9d2c4'); grd.addColorStop(0.5, '#fbf7ef'); grd.addColorStop(1, '#cfc8ba'); g.fillStyle = grd; g.fillRect(i * pitch - w / 2, -s, w, 2 * s); }
  for (let i = -8; i <= 8; i++) { const grd = g.createLinearGradient(0, i * pitch - w / 2, 0, i * pitch + w / 2); grd.addColorStop(0, '#cfc8ba'); grd.addColorStop(0.5, '#f6f1e8'); grd.addColorStop(1, '#d9d2c4'); g.fillStyle = grd; g.fillRect(-s, i * pitch - w / 2, 2 * s, w); }
  g.restore(); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
{
  const fenceFrag = /* glsl */`uniform sampler2D map; uniform vec3 uColor; uniform float uMix; uniform float uOpacity; uniform vec3 uLight; uniform vec2 uRepeat; varying vec2 vUv; varying vec3 vW;
    void main(){ vec4 t = texture2D(map, vUv * uRepeat); float fadeY = smoothstep(-13.5, -9.0, vW.y) * smoothstep(1.0, -1.5, vW.y); float fadeX = smoothstep(12.0, 10.0, abs(vW.x));
      float l = 0.7 + 0.45 * smoothstep(13.0, 0.0, distance(vW.xy, uLight.xy)); vec3 c = mix(t.rgb * l, uColor, uMix); gl_FragColor = vec4(c, t.a * uOpacity * fadeY * fadeX); }`;
  const mat = (map, color, mix, opacity) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: vert, fragmentShader: fenceFrag,
    uniforms: { map: { value: map }, uColor: { value: new THREE.Color(color) }, uMix: { value: mix }, uOpacity: { value: opacity }, uLight: { value: light }, uRepeat: { value: new THREE.Vector2(5, 3) } } });
  const tex = latticeTexture();
  const lattice = new THREE.Mesh(new THREE.PlaneGeometry(26, 15), mat(tex, 0xffffff, 0, 1)); lattice.position.set(0, -7.0, -3.2); lattice.renderOrder = -1;
  const shadow = new THREE.Mesh(lattice.geometry, mat(tex, 0x120c08, 1, 0.3)); shadow.position.set(0.25, -7.35, -4.1); shadow.renderOrder = -1;
  scene.add(shadow, lattice);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(30, 22), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: vert, fragmentShader: waterFrag, uniforms: { uStep, uLight: { value: light } } }));
  water.position.set(0, -21, 1.8); water.renderOrder = 5; scene.add(water);
}

// ---------- pieces and rigs ----------
const pieces = [], pickable = [], alphaCache = new Map(), texCache = new Map();
const getTex = name => texCache.get(name) || (texCache.set(name, loadTex(`assets/${name}.png`)), texCache.get(name));
function alphaAt(tex, uv) {
  let data = alphaCache.get(tex);
  if (!data) { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.drawImage(tex.image, 0, 0, 128, 128); data = g.getImageData(0, 0, 128, 128).data; alphaCache.set(tex, data); }
  const x = Math.min(127, Math.max(0, uv.x * 128 | 0)), y = Math.min(127, Math.max(0, (1 - uv.y) * 128 | 0));
  return data[(y * 128 + x) * 4 + 3] / 255;
}
function pieceMaterial(tex, y, opacity = 1) {
  const { t, ambient } = tintFor(y);
  return new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: pieceFrag, transparent: true, depthWrite: false,
    uniforms: { map: { value: tex }, uLight: { value: light }, uAmbient: { value: ambient }, uTint: { value: t }, uOpacity: { value: opacity }, uPulse } });
}
let missingName = null;
async function addPiece(entry, manifest, instance = 0, instances = 1) {

  tear.mesh.visible = tear.prog > -0.19;

  // the lamp follows the hand
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(lightPlane, unproj)) lightTarget.set(unproj.x, unproj.y, 2.0);
  light.lerp(lightTarget, 1 - Math.exp(-dt * 6));

  // stop-motion: poses update 12 times a second, with registration error
  stepAcc += dt; const stepped = stepAcc >= 1 / 12;
  if (stepped) {
    stepAcc -= 1 / 12; stepIndex++; uStep.value = stepIndex;
    const T = stepIndex / 12;
    for (const p of pieces) {
      if (!reduced) { p.jitter.set((Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.012, 0); p.jrot = (Math.random() - 0.5) * 0.004; }
      const pose = rigPose(p, b, T);
      p.pose = pose;
      if (p.rig.type === 'frames' && p.altTex) { const alt = Math.floor(b / p.rig.every) % 2 === 1; p.mesh.material.uniforms.map.value = alt ? p.altTex : p.tex; }
      if (p.jaw) {
        const e8 = Math.floor(b * 2), ph8 = (b * 2) % 1, open = SYLLABLES[((e8 % 32) + 32) % 32] ? Math.max(0, 1 - ph8 * 1.5) : 0;
        const o = reduced ? 0 : open;
        p.jaw.position.y = p.jaw.userData.rest.y - o * 0.16; p.jaw.rotation.z = -o * 0.07; p.jaw.position.x = p.jaw.userData.rest.x + o * 0.03;
        pose.rot += Math.sin(b * Math.PI) * 0.015 * (reduced ? 0 : 1);
      }
      if (p.flame) { const f = 0.85 + Math.random() * 0.3; p.flame.scale.set(f, 0.9 + Math.random() * 0.25, 1); p.flame.rotation.z = (Math.random() - 0.5) * 0.15; p.halo.material.opacity = 0.25 + Math.random() * 0.15; }
    }
  }
  for (const p of pieces) {
    const pose = p.pose || { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 };
    const liftTarget = state.hover === p ? 1 : 0; p.lift += (liftTarget - p.lift) * (1 - Math.exp(-dt * 8));
    const g = p.group;
    g.position.set(p.rest.x + pose.dx + p.jitter.x, p.rest.y + pose.dy + p.jitter.y, p.rest.z + p.lift * 0.35);
    g.rotation.z = p.rot + pose.rot + p.jrot; g.scale.set(pose.sx, pose.sy, 1);
    if (p.flash) { const ph = b % 4; const f = Math.max(0, 1 - ph * 2.2); p.flash.material.opacity = (Math.floor(b / 4) % 2 === 0 ? f : 0) * (reduced ? 0 : 1); }
    if (p.shadow) {
      const gap = g.position.z + 6;
      tmpV.set(g.position.x - light.x, g.position.y - light.y, 0); const d = tmpV.length() || 1; tmpV.multiplyScalar(1 / d);
      const len = 0.05 * gap + 0.06 * gap * Math.min(1.6, d / 5);
      p.shadow.position.set(g.position.x + tmpV.x * len, g.position.y + tmpV.y * len - 0.02 * gap, g.position.z - 0.12);
      p.shadow.rotation.z = g.rotation.z; p.shadow.scale.set(pose.sx * (1 + 0.012 * gap), pose.sy * (1 + 0.012 * gap), 1);
      p.shadow.material.opacity = 0.2 + 0.26 * THREE.MathUtils.smoothstep(12 - d, 0, 12);
    }
  }
  // scraps
  for (const s of scraps) {
    if (s.life <= 0) continue; s.life -= dt;
    s.mesh.position.x += s.vx * dt; s.mesh.position.y += s.vy * dt; s.mesh.rotation.z += s.vr * dt;
    s.mesh.material.uniforms.uOpacity.value = Math.min(1, s.life * 4);
    if (s.life <= 0) s.mesh.visible = false;
  }

  // hover
  let hover = null;
  if (state.entered) { const hits = raycaster.intersectObjects(pickable, false); for (const h of hits) { const p = h.object.userData.piece; if (p && h.uv && alphaAt(p.tex, h.uv) > 0.5) { hover = p; break; } } }
  if (hover !== state.hover) { state.hover = hover; if (hover) rustle(); }
  showCaption(hover ? hover.caption : null);
  document.body.style.cursor = hover ? 'pointer' : 'default';

  // the heart opens for stillness
  const nearHeart = Math.abs(state.y - HEART.y) < 5, idle = Math.min(now - state.lastMove, now - state.lastScroll);
  if (state.entered && nearHeart && !heart.open) {
    whisper(idle > 4200 ? 'wait.' : idle > 2200 ? 'there is a heart cut in the barrel.' : null);
    if (idle > 6500) { heart.open = true; mem.set('heart1', true); swell(); whisper(null); }
  } else if (!heart.open) whisper(whisperText && whisperText.startsWith('tap') ? whisperText : null);
  if (heart.open && heart.t < 1) { heart.t = Math.min(1, heart.t + dt / 3.2); applyHeart(); }

  depthEl.textContent = `${Math.round(-state.y)} m`;
  screenFlash = Math.max(0, screenFlash - dt * 3); flashEl.style.opacity = screenFlash;
  renderer.render(scene, camera);
}

// ---------- boot ----------
(async () => {
  let manifest = {};
  try { manifest = await (await fetch('assets/manifest.json')).json(); } catch (e) { console.warn('no manifest', e); }
  const hero = LAYOUT.find(e => e[8] === 'hero');
  if (hero) await addPiece(hero, manifest);
  frame();
  const rest = LAYOUT.filter(e => e[8] !== 'hero');
  const candidates = rest.filter(e => !e[9]);   // never remove a multiple
  missingName = visits > 1 ? candidates[Math.floor(visitRand() * candidates.length)][0] : null;
  const jobs = [];
  for (const e of rest) {
    if (e[0] === missingName) continue;
    const n = e[9] ? e[9].count : 1;
    for (let i = 0; i < n; i++) jobs.push(addPiece(e, manifest, i, n).catch(err => console.warn(e[0], err)));
  }
  await Promise.all([addBackdrops(manifest), ...jobs]);
  await buildHeart(manifest);
  await buildScraps(manifest);
  window.DE = { pieces, scene, camera, heart, scraps };
})();
</script>
