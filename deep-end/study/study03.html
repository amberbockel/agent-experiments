  #caption.on { opacity: 1; transform: none; }
  #whisper { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 13px; font-style: italic;

  #drop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(11,10,12,0.72); font-size: 14px;
    letter-spacing: 0.2em; text-transform: lowercase; color: var(--ink); pointer-events: none; }

const vert = /* glsl */`varying vec2 vUv; varying vec3 vW;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const pieceFrag = /* glsl */`
  uniform sampler2D map; uniform vec3 uLight; uniform float uAmbient; uniform vec3 uTint; uniform float uOpacity; uniform float uPulse;
  varying vec2 vUv; varying vec3 vW;
  void main(){
    vec4 t = texture2D(map, vUv); if (t.a < 0.02) discard;
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(12.0, 0.0, d) * (1.0 + 0.3 * uPulse);
    vec3 c = t.rgb * (uAmbient + 0.5 * spot) * uTint;
    c *= mix(vec3(1.0), vec3(1.07, 1.0, 0.93), spot);
    gl_FragColor = vec4(c, t.a * uOpacity);
  }`;
const backFrag = /* glsl */`
  uniform sampler2D map; uniform vec3 uLight; uniform float uPulse; uniform vec2 uRepeat; uniform vec2 uOff; uniform float uTop; uniform float uBottom; uniform float uStep; uniform float uSat;
  varying vec2 vUv; varying vec3 vW;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  void main(){
    vec3 t = texture2D(map, vUv * uRepeat + uOff).rgb;
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(16.0, 0.0, d) * (1.0 + 0.25 * uPulse);
    vec3 c = t * (0.6 + 0.45 * spot);
    c = mix(vec3(dot(c, vec3(0.3, 0.59, 0.11))), c, uSat);
    float g = hash(floor(vW.xy * 60.0) + uStep) - 0.5; c += g * 0.045;
    float fade = smoothstep(uTop, uTop - 3.5, vW.y) * smoothstep(uBottom, uBottom + 3.5, vW.y);
    gl_FragColor = vec4(c, fade);
  }`;
const waterFrag = /* glsl */`
  uniform float uStep; uniform vec3 uLight; varying vec3 vW; varying vec2 vUv;
  void main(){
    float t = uStep / 12.0; vec2 p = vW.xy * 0.9;
    float c1 = sin(p.x * 1.7 + t * 0.8) + sin(p.y * 1.3 - t * 0.6);
    float c2 = sin((p.x + p.y) * 1.1 + t * 0.5) + sin((p.x - p.y) * 0.9 - t * 0.7);
    float caustic = pow(max(0.0, 0.5 + 0.25 * (c1 + c2)), 3.0);
    float edge = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
    float spot = smoothstep(12.0, 0.0, distance(vW.xy, uLight.xy));
    vec3 col = mix(vec3(0.12, 0.38, 0.55), vec3(0.55, 0.85, 0.95), caustic * (0.4 + 0.6 * spot));
    gl_FragColor = vec4(col, edge * (0.16 + 0.12 * caustic));
  }`;

  uniform float uProg; uniform float uSeed; uniform float uDir; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);

  void main(){
    vec2 uv = vUv; if (uDir > 0.5) uv.x = 1.0 - uv.x;
    float n = noise(uv * vec2(3.0, 9.0) + uSeed * 17.0) * 0.6 + noise(uv * vec2(12.0, 30.0) + uSeed * 31.0) * 0.4;
    float torn = uv.x * 0.72 + n * 0.28;
    float a = 1.0 - smoothstep(uProg - 0.015, uProg + 0.015, torn);
    float edge = smoothstep(uProg - 0.06, uProg - 0.015, torn);
    vec3 paper = vec3(0.98, 0.965, 0.93);
    vec3 fibre = mix(paper, vec3(0.78, 0.72, 0.64), edge * 0.8);
    float grain = (hash(floor(vUv * 500.0)) - 0.5) * 0.05;
    gl_FragColor = vec4(fibre + grain, a);
  }`;

let songName = null;
const taps = [];

const tempoEl = document.getElementById('tempo');
function updateTempo() { tempoEl.innerHTML = `<b>${beat.bpm} bpm</b> · ${songName ? songName : 'house groove'} · drop a song · T taps`; }
updateTempo();

// ---------- input ----------
const state = { targetY: 0, y: 0, px: 0, py: 0, lastMove: performance.now(), lastScroll: performance.now(), entered: false, hover: null, floor: 0 };
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(0, 0);
function onMove(cx, cy) { ndc.x = (cx / innerWidth) * 2 - 1; ndc.y = -(cy / innerHeight) * 2 + 1; state.lastMove = performance.now(); state.px = ndc.x; state.py = ndc.y; }
addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
addEventListener('wheel', e => { state.targetY -= e.deltaY * 0.012; clampY(); state.lastScroll = performance.now(); }, { passive: true });
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
addEventListener('touchmove', e => { const t = e.touches[0]; if (touchY !== null) { state.targetY += (t.clientY - touchY) * 0.02; touchY = t.clientY; clampY(); state.lastScroll = performance.now(); } onMove(t.clientX, t.clientY); }, { passive: true });
addEventListener('touchend', () => { touchY = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { state.targetY -= 2.5; clampY(); state.lastScroll = performance.now(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { state.targetY += 2.5; clampY(); state.lastScroll = performance.now(); }
  if (e.key === 't' || e.key === 'T') tap();
});
const dropEl = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
addEventListener('dragleave', e => { if (e.relatedTarget === null) dropEl.classList.remove('on'); });
addEventListener('drop', e => { e.preventDefault(); dropEl.classList.remove('on'); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('audio/')); if (f) playSong(f); });
function clampY() { state.targetY = Math.min(0, Math.max(FLOOR_Y, state.targetY)); }
function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); fitOverlay(); }
addEventListener('resize', resize); resize();
const intro = document.getElementById('intro');
document.getElementById('enter').addEventListener('click', () => { startSound(); state.entered = true; intro.classList.add('gone'); state.lastScroll = performance.now(); });

// ---------- captions ----------
const captionEl = document.getElementById('caption'), whisperEl = document.getElementById('whisper'), depthEl = document.getElementById('depth'), flashEl = document.getElementById('flash');
let shownCaption = null, whisperText = null;
function showCaption(text) { if (text === shownCaption) return; shownCaption = text; if (!text) { captionEl.classList.remove('on'); return; } captionEl.textContent = text; captionEl.classList.add('on'); }
function whisper(text) { if (text === whisperText) return; whisperText = text; if (!text) { whisperEl.classList.remove('on'); return; } whisperEl.textContent = text; whisperEl.classList.add('on'); }

// ---------- main loop ----------
const clock = new THREE.Clock();
let stepAcc = 0, stepIndex = 0, lastBeat = -1, kickEnv = 0, screenFlash = 0;
const tmpV = new THREE.Vector3(), lightPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), unproj = new THREE.Vector3();

function rigPose(p, b, T) {

    case 'rock': out.rot = THREE.MathUtils.degToRad(r.amp) * Math.sin(2 * Math.PI * (b + p.phase * 0.3) / r.beats) * amp; break;
    case 'hop': { const ph = ((b + p.instance * 0.37) % r.every); const u = Math.min(1, ph / 0.8); out.dy = r.h * Math.sin(Math.PI * u) * amp;

function frame() {

    if (beatIdx % 4 === 0) { throwScraps(state.y, 2 + (beatIdx % 8 === 0 ? 2 : 0)); if (tear.pending) { tear.pending = false; tear.prog = 1.15; tear.seed = Math.random(); tear.mesh.material.uniforms.uDir.value = Math.random() < 0.5 ? 0 : 1; } }

}

// ---------- boot ----------
(async () => {
  let manifest = {};
  try { manifest = await (await fetch('assets/manifest.json')).json(); } catch (e) { console.warn('no manifest', e); }
  const hero = LAYOUT.find(e => e[8] === 'hero');
  if (hero) await addPiece(hero, manifest);
  frame();
  const rest = LAYOUT.filter(e => e[8] !== 'hero');
  const candidates = rest.filter(e => !e[9]);   // never remove a multiple
  missingName = visits > 1 ? candidates[Math.floor(visitRand() * candidates.length)][0] : null;
  const jobs = [];
  for (const e of rest) {
    if (e[0] === missingName) continue;
    const n = e[9] ? e[9].count : 1;
    for (let i = 0; i < n; i++) jobs.push(addPiece(e, manifest, i, n).catch(err => console.warn(e[0], err)));
  }
  await Promise.all([addBackdrops(manifest), ...jobs]);
  await buildHeart(manifest);
  await buildScraps(manifest);
  window.DE = { pieces, scene, camera, heart, scraps };
})();
