<title>Deep End</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Material study 01: a paper house you fall through.
     Single committed look: a dark room around a lit column of paper. */
  :root {
    --ink: #f3ede2;
    --ink-dim: rgba(243, 237, 226, 0.55);
    --room: #0b0a0c;
    --mono: "Courier Prime", "Courier New", Courier, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--room);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    box-sizing: border-box;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* vignette and a hint of paper dust over everything */
  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }

  .hud {
    position: fixed; z-index: 3; pointer-events: none;
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  #brand { top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); }
  #depth { top: calc(18px + env(safe-area-inset-top, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); }
  #caption {
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: max(20px, env(safe-area-inset-left, 0px));
    right: max(20px, env(safe-area-inset-right, 0px));
    font-size: 14px; color: var(--ink);
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    text-transform: none; letter-spacing: 0.02em;
  }
  #caption.on { opacity: 1; transform: none; }
  #whisper {
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0; text-align: center;
    font-size: 13px; font-style: italic; color: var(--ink-dim);
    opacity: 0; transition: opacity 1.2s ease;
    text-transform: none;
  }
  #whisper.on { opacity: 1; }

  /* intro */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; text-align: center;
    background: var(--room);
    transition: opacity 1.4s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .card {
    max-width: 32ch; padding: 24px;
    display: grid; gap: 22px; justify-items: center;
  }
  #intro h1 {
    font-weight: 400; font-size: 15px; letter-spacing: 0.34em;
    text-transform: lowercase; margin: 0; color: var(--ink);
    text-wrap: balance;
  }
  #intro p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-dim); text-wrap: balance; }
  #enter {
    font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: lowercase;
    color: var(--ink); background: transparent;
    border: 1px solid rgba(243,237,226,0.35); border-radius: 999px;
    padding: 12px 26px; cursor: pointer;
    transition: border-color 0.3s, background 0.3s;
  }
  #enter:hover, #enter:focus-visible { border-color: var(--ink); background: rgba(243,237,226,0.06); outline: none; }
  #again { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.12em; min-height: 1em; }

  @media (prefers-reduced-motion: reduce) {
    #intro { transition: none; }
  }
</style>

<div id="stage"></div>
<div id="veil"></div>
<div id="brand" class="hud">deep end · study 01</div>
<div id="depth" class="hud">0 m</div>
<div id="caption" class="hud"></div>
<div id="whisper" class="hud"></div>

<div id="intro">
  <div class="card">
    <h1>deep end</h1>
    <p>a house made of paper.<br>scroll, or do nothing, and you fall.<br>some doors only open if you wait.</p>
    <button id="enter" type="button">enter</button>
    <div id="again"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---------- memory: the house remembers you ----------
const mem = {
  get(k, d) { try { const v = localStorage.getItem('deepend.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('deepend.' + k, JSON.stringify(v)); } catch {} },
};
const visits = mem.get('visits', 0) + 1;
mem.set('visits', visits);
const doorOpenedBefore = mem.get('door1', false);
if (visits > 1) {
  document.getElementById('again').textContent =
    visits === 2 ? 'you have been here before' : `visit ${visits}. the rooms have moved.`;
}

// seeded random so each visit rearranges the same way for that visit
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const visitRand = mulberry(1000 + visits * 7919);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- layout ----------
// y runs downward. zone A (yard) 0..-13, zone B (water) -13..-27, zone C (dark) -27..-40
const FLOOR = -38.6;
const LAYOUT = [
  // zone A: the yard
  ['girl-sunglasses', -1.0, -0.6,  0.0, 7.2,  -2, 'the yard', true],
  ['heather',          2.7, -2.5,  0.4, 3.4,   3, 'the heather'],
  ['girl-closeup',     3.7,  2.3, -2.4, 4.2,  -6, 'same day, no sunglasses'],
  ['print-drawing',   -4.3,  1.7,  0.8, 3.0, -12, 'october 1987'],
  ['print-lattice',   -4.8, -3.0, -2.6, 2.6,   6, 'the lattice'],
  ['girl-picnic',     -3.9, -5.6, -1.2, 3.3,   8, 'the picnic'],
  ['mom-and-me',       3.4, -7.1, -0.8, 3.0,  -5, 'mom, and the rabbit'],
  ['girl-cat',        -1.1, -9.6, -1.8, 3.6,   4, 'the chair, the cat'],
  ['toddler-gift',     3.9,-10.9,  0.2, 3.4,  -9, 'wrapping paper'],
  // zone B: the water
  ['print-pool',       0.6,-13.6, -2.5, 4.6,  -4, 'the pool'],
  ['print-portrait',   4.5,-15.6, -3.0, 2.8, -14, 'school picture'],
  ['girl-swing',      -1.7,-17.6,  0.0, 6.4, 165, 'the swing, upside down'],
  ['tulle',            3.7,-19.6, -1.5, 5.0,  12, 'the skirt'],
  ['horse-white',     -4.1,-21.6, -1.0, 3.4,  -6, 'the white horse'],
  ['print-cake',       0.5,-23.6,  0.6, 3.6,  -3, 'one candle'],
  ['horse-brown',      3.3,-24.2, -2.2, 3.0,   5, 'the brown horse'],
  ['teen-orchids',    -3.3,-26.2, -0.6, 4.6,   7, 'orchids'],
  // zone C: the dark
  ['print-painting',  -3.7,-29.6, -3.0, 3.4,  -3, 'the field'],
  ['cameras',          3.3,-30.6, -0.8, 4.4,   6, 'two cameras, 2025'],
  ['print-webcam-a',  -4.7,-31.8, -2.8, 2.0,   9, 'sunlight, the apartment'],
  ['william-bryce',   -3.5,-33.6, -1.4, 4.0,  -4, 'bryce canyon'],
  ['cotton-candy',     3.7,-34.6, -2.0, 4.2,   8, 'harajuku'],
  ['rabbit',          -1.9,-36.7,  0.2, 1.6,  -8, 'the rabbit'],
  ['print-webcam-b',   4.7,-38.1, -2.8, 2.0, -11, 'the fan'],
  ['red-car',         -0.1,-39.6, -1.6, 3.0,  -2, 'the red car'],
];
const DOOR = { x: 1.3, y: -36.4, z: -2.2, w: 3.2, h: 5.4, behind: 'baby-dad', caption: 'the first photograph' };

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0a0c, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 12);

const light = new THREE.Vector3(1.5, 1.0, 2.0);   // where the warm lamp is
const lightTarget = light.clone();

// ---------- shaders ----------
const pieceVert = /* glsl */`
  varying vec2 vUv; varying vec3 vW;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w; }`;
const pieceFrag = /* glsl */`
  uniform sampler2D map; uniform vec3 uLight; uniform float uAmbient; uniform vec3 uTint; uniform float uOpacity;
  varying vec2 vUv; varying vec3 vW;
  void main(){
    vec4 t = texture2D(map, vUv);
    if (t.a < 0.02) discard;
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(11.0, 0.0, d);
    float l = uAmbient + 0.62 * spot;
    vec3 c = t.rgb * l * uTint;
    c *= mix(vec3(1.0), vec3(1.07, 1.0, 0.93), spot);
    gl_FragColor = vec4(c, t.a * uOpacity);
  }`;
const wallFrag = /* glsl */`
  uniform vec3 uLight; uniform float uStep;
  varying vec3 vW; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  void main(){
    float y = vW.y;
    vec3 warm = vec3(0.93, 0.87, 0.78);
    vec3 cool = vec3(0.50, 0.62, 0.70);
    vec3 dark = vec3(0.085, 0.075, 0.095);
    vec3 base = mix(warm, cool, smoothstep(-10.0, -16.0, y));
    base = mix(base, dark, smoothstep(-24.0, -31.0, y));
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(15.0, 0.0, d);
    vec3 c = base * (0.70 + 0.55 * spot);
    c += vec3(0.11, 0.065, 0.02) * spot * spot;
    float g = hash(floor(vW.xy * 70.0) + uStep) - 0.5;   // film grain, stepped at 12fps
    c += g * 0.04;
    gl_FragColor = vec4(c, 1.0);
  }`;
const waterFrag = /* glsl */`
  uniform float uStep; uniform vec3 uLight;
  varying vec3 vW; varying vec2 vUv;
  void main(){
    float t = uStep / 12.0;
    vec2 p = vW.xy * 0.9;
    float c1 = sin(p.x * 1.7 + t * 0.8) + sin(p.y * 1.3 - t * 0.6);
    float c2 = sin((p.x + p.y) * 1.1 + t * 0.5) + sin((p.x - p.y) * 0.9 - t * 0.7);
    float caustic = pow(max(0.0, 0.5 + 0.25 * (c1 + c2)), 3.0);
    float edge = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
    float d = distance(vW.xy, uLight.xy);
    float spot = smoothstep(12.0, 0.0, d);
    vec3 col = mix(vec3(0.12, 0.38, 0.55), vec3(0.55, 0.85, 0.95), caustic * (0.4 + 0.6 * spot));
    gl_FragColor = vec4(col, edge * (0.22 + 0.14 * caustic));
  }`;

const uStep = { value: 0 };

// ---------- the wall ----------
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShaderMaterial({ vertexShader: pieceVert, fragmentShader: wallFrag, uniforms: { uLight: { value: light }, uStep } })
);
wall.position.set(0, -19, -6);
scene.add(wall);

// ---------- the lattice (zone A) ----------
function latticeTexture() {
  const s = 1024, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.clearRect(0, 0, s, s);
  g.save(); g.translate(s / 2, s / 2); g.rotate(Math.PI / 4);
  const pitch = 190, w = 54;
  for (let i = -8; i <= 8; i++) {
    const grd = g.createLinearGradient(i * pitch - w / 2, 0, i * pitch + w / 2, 0);
    grd.addColorStop(0, '#d9d2c4'); grd.addColorStop(0.5, '#fbf7ef'); grd.addColorStop(1, '#cfc8ba');
    g.fillStyle = grd; g.fillRect(i * pitch - w / 2, -s, w, 2 * s);
  }
  for (let i = -8; i <= 8; i++) {
    const grd = g.createLinearGradient(0, i * pitch - w / 2, 0, i * pitch + w / 2);
    grd.addColorStop(0, '#cfc8ba'); grd.addColorStop(0.5, '#f6f1e8'); grd.addColorStop(1, '#d9d2c4');
    g.fillStyle = grd; g.fillRect(-s, i * pitch - w / 2, 2 * s, w);
  }
  g.restore();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4; return t;
}
function gardenTexture() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#2a3a26'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(${40 + Math.random() * 70 | 0},${55 + Math.random() * 60 | 0},${30 + Math.random() * 40 | 0},${0.25 + Math.random() * 0.5})`;
    g.beginPath(); g.ellipse(Math.random() * s, Math.random() * s, 6 + Math.random() * 14, 3 + Math.random() * 7, Math.random() * 3, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
{
  // a fence section, not wallpaper: it fades out below the yard and the wall shows either side
  const fenceFrag = /* glsl */`
    uniform sampler2D map; uniform vec3 uColor; uniform float uMix; uniform float uOpacity; uniform vec3 uLight; uniform vec2 uRepeat;
    varying vec2 vUv; varying vec3 vW;
    void main(){
      vec4 t = texture2D(map, vUv * uRepeat);
      float fadeY = smoothstep(-15.5, -9.5, vW.y) * smoothstep(7.5, 4.0, vW.y);
      float fadeX = smoothstep(9.5, 7.5, abs(vW.x));
      float d = distance(vW.xy, uLight.xy);
      float l = 0.7 + 0.45 * smoothstep(13.0, 0.0, d);
      vec3 c = mix(t.rgb * l, uColor, uMix);
      gl_FragColor = vec4(c, t.a * uOpacity * fadeY * fadeX);
    }`;
  const fenceMat = (map, color, mix, opacity, rx, ry) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: pieceVert, fragmentShader: fenceFrag,
    uniforms: { map: { value: map }, uColor: { value: new THREE.Color(color) }, uMix: { value: mix }, uOpacity: { value: opacity }, uLight: { value: light }, uRepeat: { value: new THREE.Vector2(rx, ry) } } });
  const latTex = latticeTexture();
  const lattice = new THREE.Mesh(new THREE.PlaneGeometry(20, 22), fenceMat(latTex, 0xffffff, 0, 1, 4, 4.4));
  lattice.position.set(0, -4.0, -3.2);
  const latShadow = new THREE.Mesh(lattice.geometry, fenceMat(latTex, 0x120c08, 1, 0.3, 4, 4.4));
  latShadow.position.set(0.25, -4.35, -4.1);
  const gardTex = gardenTexture();
  const garden = new THREE.Mesh(new THREE.PlaneGeometry(20, 22), fenceMat(gardTex, 0x0d140c, 0.45, 0.9, 5, 5.5));
  garden.position.set(0, -4.0, -4.6);
  scene.add(garden, latShadow, lattice);
}

// ---------- the water (zone B) ----------
{
  const water = new THREE.Mesh(new THREE.PlaneGeometry(30, 18),
    new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: pieceVert, fragmentShader: waterFrag,
      uniforms: { uStep, uLight: { value: light } } }));
  water.position.set(0, -20.5, 1.8); water.scale.y = 1.25;
  scene.add(water);
}

// ---------- pieces ----------
const loader = new THREE.TextureLoader();
const pieces = [];
const pickable = [];
const alphaCache = new Map();

function zoneAt(y) {
  const a = THREE.MathUtils.smoothstep(y, -16, -10);   // 1 in yard, 0 in water
  const c = 1 - THREE.MathUtils.smoothstep(y, -31, -24);   // 1 in dark
  return { yard: a, dark: c };
}
function tintFor(y) {
  const { yard, dark } = zoneAt(y);
  const warm = new THREE.Color(1.0, 0.97, 0.92);
  const cool = new THREE.Color(0.80, 0.90, 0.98);
  const dim = new THREE.Color(0.78, 0.74, 0.80);
  const t = cool.clone().lerp(warm, yard).lerp(dim, dark);
  const ambient = 0.46 + 0.22 * yard - 0.10 * dark;
  return { t, ambient };
}

function alphaAt(tex, uv) {
  let data = alphaCache.get(tex);
  if (!data) {
    const img = tex.image; const c = document.createElement('canvas');
    const s = 128; c.width = s; c.height = s;
    c.getContext('2d').drawImage(img, 0, 0, s, s);
    data = c.getContext('2d').getImageData(0, 0, s, s).data; alphaCache.set(tex, data);
  }
  const x = Math.min(127, Math.max(0, uv.x * 128 | 0)), y = Math.min(127, Math.max(0, (1 - uv.y) * 128 | 0));
  return data[(y * 128 + x) * 4 + 3] / 255;
}

function loadTex(url) {
  return new Promise((res, rej) => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, rej));
}

async function addPiece(entry, manifest) {
  const [name, x0, y0, z, h, rotDeg, caption, hero] = entry;
  const m = manifest[name]; if (!m) return null;
  // the house rearranges a little each visit. the hero stays.
  const drift = hero || visits === 1 ? 0 : 0.7;
  const x = x0 + (visitRand() - 0.5) * 2 * drift;
  const y = y0 + (visitRand() - 0.5) * 2 * drift * 0.6;
  const rot = THREE.MathUtils.degToRad(rotDeg + (hero ? 0 : (visitRand() - 0.5) * 8 * (visits > 1 ? 1 : 0)));

  const [tex, shTex] = await Promise.all([loadTex(`assets/${name}.png`), loadTex(`assets/${name}_shadow.png`)]);
  const w = h * (m.w / m.h);
  const geo = new THREE.PlaneGeometry(w, h);
  const { t, ambient } = tintFor(y);
  const mat = new THREE.ShaderMaterial({
    vertexShader: pieceVert, fragmentShader: pieceFrag, transparent: true, depthWrite: false,
    uniforms: { map: { value: tex }, uLight: { value: light }, uAmbient: { value: ambient }, uTint: { value: t }, uOpacity: { value: 1 } },
  });
  const mesh = new THREE.Mesh(geo, mat);
  const shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ alphaMap: shTex, color: 0x100a08, transparent: true, opacity: 0.4, depthWrite: false }));
  shadow.renderOrder = 1; mesh.renderOrder = 2;
  const piece = { name, mesh, shadow, caption, rest: new THREE.Vector3(x, y, z), rot, lift: 0, jitter: new THREE.Vector3(), jrot: 0, phase: Math.random() * 7, hero: !!hero, tex };
  mesh.userData.piece = piece;
  pieces.push(piece); pickable.push(mesh);
  scene.add(shadow, mesh);
  return piece;
}

// ---------- the door (zone C) ----------
const door = { group: null, open: doorOpenedBefore, t: doorOpenedBefore ? 1 : 0, glow: null, photo: null, panel: null };
function doorTexture() {
  const W = 512, H = Math.round(512 * DOOR.h / DOOR.w);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#2a2124'; g.fillRect(0, 0, W, H);
  // paper edge and panel lines
  g.strokeStyle = 'rgba(243,237,226,0.22)'; g.lineWidth = 6; g.strokeRect(14, 14, W - 28, H - 28);
  g.strokeStyle = 'rgba(243,237,226,0.10)'; g.lineWidth = 3;
  g.strokeRect(70, 60, W - 140, H * 0.36); g.strokeRect(70, H * 0.5, W - 140, H * 0.4);
  // keyhole: cut through
  g.globalCompositeOperation = 'destination-out';
  const kx = W * 0.5, ky = H * 0.47;
  g.beginPath(); g.arc(kx, ky, 26, 0, 7); g.fill();
  g.beginPath(); g.moveTo(kx - 16, ky + 10); g.lineTo(kx + 16, ky + 10); g.lineTo(kx + 26, ky + 80); g.lineTo(kx - 26, ky + 80); g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function glowTexture() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, 'rgba(255,222,170,1)'); r.addColorStop(0.35, 'rgba(255,190,120,0.55)'); r.addColorStop(1, 'rgba(255,170,100,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
async function buildDoor(manifest) {
  const group = new THREE.Group(); group.position.set(DOOR.x - DOOR.w / 2, DOOR.y, DOOR.z);
  const geo = new THREE.PlaneGeometry(DOOR.w, DOOR.h); geo.translate(DOOR.w / 2, 0, 0);   // hinge on the left edge
  const panel = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    vertexShader: pieceVert, fragmentShader: pieceFrag, transparent: true, depthWrite: false,
    uniforms: { map: { value: doorTexture() }, uLight: { value: light }, uAmbient: { value: 0.35 }, uTint: { value: new THREE.Color(1, 1, 1) }, uOpacity: { value: 1 } },
  }));
  panel.renderOrder = 3;
  const shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
  shadow.position.set(0.18, -0.2, -0.3); shadow.renderOrder = 1;
  group.add(shadow, panel);
  scene.add(group);

  const glow = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.position.set(DOOR.x, DOOR.y - 0.1, DOOR.z - 0.5); glow.renderOrder = 0;
  scene.add(glow);

  let photo = null;
  if (manifest[DOOR.behind]) {
    const m = manifest[DOOR.behind];
    const tex = await loadTex(`assets/${DOOR.behind}.png`);
    const h = 3.4, w = h * m.w / m.h;
    photo = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.ShaderMaterial({
      vertexShader: pieceVert, fragmentShader: pieceFrag, transparent: true, depthWrite: false,
      uniforms: { map: { value: tex }, uLight: { value: light }, uAmbient: { value: 0.75 }, uTint: { value: new THREE.Color(1.05, 1.0, 0.95) }, uOpacity: { value: 0 } },
    }));
    photo.position.set(DOOR.x + 0.1, DOOR.y - 0.2, DOOR.z - 0.9); photo.renderOrder = 0; photo.rotation.z = -0.05;
    photo.userData.piece = { name: DOOR.behind, caption: DOOR.caption, mesh: photo, rest: photo.position.clone(), rot: -0.05, tex, isDoorPhoto: true };
    scene.add(photo);
  }
  Object.assign(door, { group, glow, photo, panel });
  applyDoor();
}
function applyDoor() {
  const t = door.t, e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  if (door.group) door.group.rotation.y = -1.95 * e;
  if (door.glow) { const s = 1 + 3.2 * e; door.glow.scale.set(s, s, 1); door.glow.material.opacity = 0.9 - 0.4 * e; }
  if (door.photo) {
    door.photo.material.uniforms.uOpacity.value = THREE.MathUtils.smoothstep(t, 0.35, 1);
    if (t > 0.6 && !pickable.includes(door.photo)) pickable.push(door.photo);
  }
}

// ---------- sound: a warm room tone made in the browser ----------
const sound = { ctx: null, master: null, filter: null, crackle: null, started: false };
function startSound() {
  if (sound.started) return; sound.started = true;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC(); sound.ctx = ctx;
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination); sound.master = master;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 520; filter.Q.value = 0.7; filter.connect(master); sound.filter = filter;
  const pad = ctx.createGain(); pad.gain.value = 0.16; pad.connect(filter);
  [[55, 'sine', 0], [82.4, 'triangle', 3], [110.2, 'sine', -4], [164.6, 'triangle', 5]].forEach(([f, type, det]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    const g = ctx.createGain(); g.gain.value = 0.25;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + Math.random() * 0.08;
    const lg = ctx.createGain(); lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(pad); o.start(); lfo.start();
  });
  // crackle: filtered noise, like a record between songs
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5 * (Math.random() < 0.0008 ? 18 : 1); }
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  const cg = ctx.createGain(); cg.gain.value = 0.05; src.connect(hp); hp.connect(cg); cg.connect(master); src.start(); sound.crackle = cg;
  master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 3);
}
function rustle() {
  const ctx = sound.ctx; if (!ctx) return;
  const len = ctx.sampleRate * 0.14, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  const s = ctx.createBufferSource(); s.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400 + Math.random() * 1600; f.Q.value = 0.8;
  const g = ctx.createGain(); g.gain.value = 0.07; s.connect(f); f.connect(g); g.connect(sound.master); s.start();
}
function swell() {
  const ctx = sound.ctx; if (!ctx) return;
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(220, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(330, ctx.currentTime + 2.4);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 1.2); g.gain.linearRampToValueAtTime(0, ctx.currentTime + 4);
  o.connect(g); g.connect(sound.master); o.start(); o.stop(ctx.currentTime + 4.1);
}
function setSoundDepth(y) {
  if (!sound.filter) return;
  const { yard, dark } = zoneAt(y);
  const f = 260 + 420 * yard - 120 * dark;
  sound.filter.frequency.setTargetAtTime(f, sound.ctx.currentTime, 0.4);
  sound.crackle.gain.setTargetAtTime(0.02 + 0.05 * yard, sound.ctx.currentTime, 0.4);
}

// ---------- input ----------
const state = { targetY: 0, y: 0, px: 0, py: 0, lastMove: performance.now(), lastScroll: performance.now(), entered: false, hover: null };
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(0, 0);

function onMove(cx, cy) {
  ndc.x = (cx / innerWidth) * 2 - 1; ndc.y = -(cy / innerHeight) * 2 + 1;
  state.lastMove = performance.now();
  state.px = ndc.x; state.py = ndc.y;
}
addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
addEventListener('wheel', e => { state.targetY -= e.deltaY * 0.012; clampY(); state.lastScroll = performance.now(); }, { passive: true });
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
addEventListener('touchmove', e => {
  const t = e.touches[0]; if (touchY !== null) { state.targetY += (t.clientY - touchY) * 0.02; touchY = t.clientY; clampY(); state.lastScroll = performance.now(); }
  onMove(t.clientX, t.clientY);
}, { passive: true });
addEventListener('touchend', () => { touchY = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { state.targetY -= 2.5; clampY(); state.lastScroll = performance.now(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { state.targetY += 2.5; clampY(); state.lastScroll = performance.now(); }
});
function clampY() { state.targetY = Math.min(0, Math.max(FLOOR, state.targetY)); }

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
}
addEventListener('resize', resize); resize();

// ---------- enter ----------
const intro = document.getElementById('intro');
document.getElementById('enter').addEventListener('click', () => {
  startSound(); state.entered = true; intro.classList.add('gone');
  state.lastScroll = performance.now();
});

// ---------- captions ----------
const captionEl = document.getElementById('caption');
const whisperEl = document.getElementById('whisper');
const depthEl = document.getElementById('depth');
let shownCaption = null;
function showCaption(text) {
  if (text === shownCaption) return; shownCaption = text;
  if (!text) { captionEl.classList.remove('on'); return; }
  captionEl.textContent = text; captionEl.classList.add('on');
}
let whisperText = null, whisperTimer = 0;
function whisper(text) {
  if (text === whisperText) return; whisperText = text;
  if (!text) { whisperEl.classList.remove('on'); return; }
  whisperEl.textContent = text; whisperEl.classList.add('on');
}

// ---------- main loop ----------
const clock = new THREE.Clock();
let stepAcc = 0, stepIndex = 0;
const tmpV = new THREE.Vector3();
const lightPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const unproj = new THREE.Vector3();
let idleNearDoor = 0;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  const now = performance.now();

  // falling
  if (state.entered && !reduced && now - state.lastScroll > 1400) { state.targetY -= 0.22 * dt; clampY(); }
  state.y += (state.targetY - state.y) * (1 - Math.exp(-dt * 3.2));
  camera.position.y = state.y + state.py * 0.35;
  camera.position.x = state.px * 0.55;
  camera.lookAt(camera.position.x * 0.6, state.y + state.py * 0.2, 0);

  // the lamp follows the hand
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(lightPlane, unproj)) lightTarget.set(unproj.x, unproj.y, 2.0);
  light.lerp(lightTarget, 1 - Math.exp(-dt * 6));

  // stop-motion: pieces only move 12 times a second, with registration error
  stepAcc += dt;
  const stepped = stepAcc >= 1 / 12;
  if (stepped) {
    stepAcc -= 1 / 12; stepIndex++; uStep.value = stepIndex;
    for (const p of pieces) {
      if (reduced) { p.jitter.set(0, 0, 0); p.jrot = 0; continue; }
      p.jitter.set((Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.012, 0);
      p.jrot = (Math.random() - 0.5) * 0.004;
    }
  }
  const T = stepIndex / 12;   // quantized time
  for (const p of pieces) {
    const bob = reduced ? 0 : Math.sin(T * 0.7 + p.phase) * 0.04;
    const sway = reduced ? 0 : Math.sin(T * 0.45 + p.phase * 1.3) * 0.012;
    const liftTarget = state.hover === p ? 1 : 0;
    p.lift += (liftTarget - p.lift) * (1 - Math.exp(-dt * 8));
    const m = p.mesh;
    m.position.set(p.rest.x + p.jitter.x, p.rest.y + bob + p.jitter.y, p.rest.z + p.lift * 0.35);
    m.rotation.z = p.rot + sway + p.jrot;
    // shadow falls away from the lamp, longer the further the paper stands off the wall
    const gap = m.position.z - (-6);
    tmpV.set(m.position.x - light.x, m.position.y - light.y, 0);
    const d = tmpV.length() || 1; tmpV.multiplyScalar(1 / d);
    const len = 0.05 * gap + 0.06 * gap * Math.min(1.6, d / 5);
    p.shadow.position.set(m.position.x + tmpV.x * len, m.position.y + tmpV.y * len - 0.02 * gap, m.position.z - 0.12);
    p.shadow.rotation.z = m.rotation.z;
    p.shadow.scale.setScalar(1 + 0.012 * gap);
    p.shadow.material.opacity = 0.22 + 0.26 * THREE.MathUtils.smoothstep(12 - d, 0, 12);
  }

  // hover
  let hover = null;
  if (state.entered) {
    const hits = raycaster.intersectObjects(pickable, false);
    for (const h of hits) {
      const p = h.object.userData.piece;
      if (p && h.uv && alphaAt(p.tex, h.uv) > 0.5) { hover = p; break; }
    }
  }
  if (hover !== state.hover) { state.hover = hover; if (hover) rustle(); }
  showCaption(hover ? hover.caption : null);
  document.body.style.cursor = hover ? 'pointer' : 'default';

  // the patience door
  const nearDoor = Math.abs(state.y - DOOR.y) < 5;
  const idle = Math.min(now - state.lastMove, now - state.lastScroll);
  if (state.entered && nearDoor && !door.open) {
    if (idle > 2200) whisper(idle > 4200 ? 'wait.' : "it's locked.");
    else whisper(null);
    if (idle > 6500) { door.open = true; mem.set('door1', true); swell(); whisper(null); }
  } else if (!door.open) whisper(null);
  if (door.open && door.t < 1) { door.t = Math.min(1, door.t + dt / 2.2); applyDoor(); }

  // hud
  depthEl.textContent = `${Math.round(-state.y * 1.0)} m`;
  if (stepped && stepIndex % 6 === 0) setSoundDepth(state.y);

  renderer.render(scene, camera);
}

// ---------- boot ----------
(async () => {
  let manifest = {};
  try { manifest = await (await fetch('assets/manifest.json')).json(); } catch (e) { console.warn('no manifest', e); }
  // hero first so the opening frame has something in it
  const hero = LAYOUT.find(e => e[7]);
  if (hero) await addPiece(hero, manifest);
  frame();
  // one piece is missing on each return visit. the hero never is.
  const rest = LAYOUT.filter(e => !e[7]);
  const missing = visits > 1 ? rest[Math.floor(visitRand() * rest.length)][0] : null;
  await Promise.all(rest.filter(e => e[0] !== missing).map(e => addPiece(e, manifest).catch(err => console.warn(e[0], err))));
  await buildDoor(manifest);
})();
</script>
